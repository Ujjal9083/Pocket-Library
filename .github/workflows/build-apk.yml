
name: Build Pocket Library APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PocketLibrary-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q PocketLibrary-Android-Source.zip

      - name: Build APK
        working-directory: PocketLibrary
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLibrary-APK
          path: PocketLibrary/app/build/outputs/apk/debug/app-debug.apk
